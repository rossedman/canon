version: "2"
linters:
  default: none
  enable:
    - errcheck
    - errorlint
    - gosec
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unused
    - wrapcheck
  exclusions:
    generated: strict
    rules:
      - path: _test\.go
        linters: [wrapcheck, gosec]
