description: A Go HTTP service with an OpenAPI spec and a distroless image
root: "{{.name}}"
records: [go-openapi-spec-first, go-errors-wrap, go-doc-comments, go-lint-baseline, containers-distroless-base, containers-pin-base-images, containers-non-root, ci-pin-actions-sha, ci-least-privilege]
vars:
  module: "github.com/example/{{.name}}"
  description: "{{.name}} serves an HTTP API"
  go: "1.27"
  port: "8080"
next:
  - go get -tool github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen
  - go mod tidy
  - go generate ./...
