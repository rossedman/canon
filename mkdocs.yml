site_name: canon
site_description: Your engineering standards, as tools agents call
site_url: https://rossedman.io/canon/
repo_url: https://github.com/rossedman/canon
repo_name: rossedman/canon
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  logo: assets/site/logo.svg
  favicon: assets/site/favicon.svg
  palette:
    scheme: slate
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow

extra_css:
  - assets/site/landing.css
  - assets/site/docs.css
extra_javascript:
  - assets/site/landing.js
  - assets/site/docs.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

exclude_docs: |
  /assets/src/
  /assets/render.sh

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/rossedman/canon

nav:
  - Home: index.md
  - Get started:
      - Getting started: getting-started.md
      - Configuration: configuration.md
  - Guides:
      - Concepts: guides/concepts.md
      - Writing records: guides/writing-records.md
      - MCP server: guides/mcp.md
      - Hooks and CI: guides/hooks-and-ci.md
  - Reference:
      - Commands:
          - reference/commands/canon.md
          - reference/commands/canon_check.md
          - reference/commands/canon_decide.md
          - reference/commands/canon_explain.md
          - reference/commands/canon_hook.md
          - reference/commands/canon_lint.md
          - reference/commands/canon_profile.md
          - reference/commands/canon_review.md
          - reference/commands/canon_scaffold.md
          - reference/commands/canon_serve.md
          - reference/commands/canon_version.md
      - Decision records:
          - reference/records/index.md
          - reference/records/ci-least-privilege.md
          - reference/records/ci-pin-actions-sha.md
          - reference/records/containers-alpine-base.md
          - reference/records/containers-distroless-base.md
          - reference/records/containers-dockerfile-hygiene.md
          - reference/records/containers-non-root.md
          - reference/records/containers-pin-base-images.md
          - reference/records/go-charmbracelet-ux.md
          - reference/records/go-cobra-one-command-per-file.md
          - reference/records/go-config-viper.md
          - reference/records/go-doc-comments.md
          - reference/records/go-errors-wrap.md
          - reference/records/go-fuzz-critical-paths.md
          - reference/records/go-lint-baseline.md
          - reference/records/go-openapi-spec-first.md
          - reference/records/go-test-coverage.md
          - reference/records/oss-community-files.md
          - reference/records/oss-conventional-commits.md
          - reference/records/oss-release-signing.md
          - reference/records/python-ruff.md
          - reference/records/python-uv.md
          - reference/records/terraform-module-conventions.md
          - reference/records/terraform-security-scan.md
          - reference/records/terraform-version-constraints.md
          - reference/records/yaml-lint.md
  - Project:
      - Contributing: contributing.md
      - Security: security.md
