name: Feature or record request
description: Suggest a feature, a checker, or a new decision record
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: For a new record, sketch its Decision section and the files it applies to
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
