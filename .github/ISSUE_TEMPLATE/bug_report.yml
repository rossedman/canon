name: Bug report
description: Something canon does is wrong or broken
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: canon version
      description: Output of `canon version`
      placeholder: canon v0.1.0 (commit abc1234, built 2026-10-28T00:00:00Z)
    validations:
      required: true
  - type: dropdown
    id: front-door
    attributes:
      label: How were you running canon?
      options:
        - CLI (canon check, decide, ...)
        - MCP server (canon serve)
        - Claude Code hook (canon hook)
        - CI
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, and the versions of any linters involved (golangci-lint, ruff, hadolint, tflint, checkov, yamllint)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The commands you ran, and a minimal file or repo that shows the problem
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and output
      description: Output with `--log-level debug`, or `--json` output for check and review
      render: shell
